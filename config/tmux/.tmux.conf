# ==============================================================================
# CONFIGURACIÓN DE TMUX — TEMA AZUL NEÓN INTENSO, TRANSPARENCIA & CÁPSULAS NERD FONT
# ==============================================================================

# --- Colores Reales (TrueColor 24-bit) y Terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%dm'

# --- Mejor Manejo General ---
set -g mouse on                        # Soporte completo de ratón (clic, scroll, redimensionar)
set -sg escape-time 5                  # Respuesta instantánea (ideal para Neovim/Zsh)
set -g history-limit 50000             # Historial amplio de scroll
set -g focus-events on                 # Eventos de foco para editores
setw -g aggressive-resize on           # Ajustar tamaño dinámicamente
set -g base-index 1                    # Empezar ventanas en 1
setw -g pane-base-index 1              # Empezar paneles en 1
set -g renumber-windows on             # Renumerar ventanas automáticamente al cerrar una
set -g set-clipboard on                # Sincronizar portapapeles del sistema
set -g allow-passthrough on            # Permitir Kitty Graphics Protocol (renderizar imágenes)
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- Tecla Prefijo: Ctrl + b (y Ctrl + a como alternativo) ---
set -s extended-keys on
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix

# --- Modo Copia y Portapapeles (Copiar fácil con Ctrl+C, Ratón y Selección) ---
setw -g mode-keys vi

# Copiar con 'y' o 'Enter' al portapapeles del sistema (xsel / wl-copy / xclip)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode Enter send -X copy-pipe-and-cancel "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"

# Copiar con Ctrl+C en modo copia (tanto en vi como en emacs) y salir limpiamente
bind -T copy-mode-vi C-c send -X copy-pipe-and-cancel "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode C-c send -X copy-pipe-and-cancel "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"

# Al arrastrar y soltar con el ratón: COPIA automáticamente al portapapeles y NO borra la selección de golpe
# (así puedes ver qué seleccionaste y además pulsar Ctrl+C si tienes la costumbre)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"

# Doble clic: selecciona palabra completa y la copia al portapapeles
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"

# Triple clic: selecciona toda la línea y la copia al portapapeles
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "xsel -i -b 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"

# --- Navegación y Scroll Fluido (Rueda del Ratón y PageUp/PageDown) ---
# Rueda del ratón hacia arriba: entra al scroll automáticamente
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
bind -n WheelDownPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { send-keys -M }

# Dentro del scroll: subir y bajar de forma suave; al llegar abajo cancela el modo copia automáticamente
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down-and-cancel
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 3 scroll-down-and-cancel

# Teclas RePág (PageUp) y AvPág (PageDown) directas sin prefijo para navegar historial largo
bind -n PageUp copy-mode -u
bind -n S-PageUp copy-mode -u
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down-and-cancel
bind -T copy-mode PageUp send-keys -X page-up
bind -T copy-mode PageDown send-keys -X page-down-and-cancel

# --- Atajos Solicitados (Directos sin prefijo y también con prefijo) ---
# Ctrl + t -> Dividir en horizontal (arriba / abajo) conservando ruta actual
bind -n C-t split-window -v -c "#{pane_current_path}"
bind C-t split-window -v -c "#{pane_current_path}"
bind t split-window -v -c "#{pane_current_path}"

# Ctrl + f -> Dividir en vertical (izquierda / derecha) conservando ruta actual
bind -n C-f split-window -h -c "#{pane_current_path}"
bind C-f split-window -h -c "#{pane_current_path}"
bind f split-window -h -c "#{pane_current_path}"

# Ctrl + z -> Focus / Zoom (maximizar y restaurar panel a pantalla completa)
bind -n C-z resize-pane -Z
bind C-z resize-pane -Z
bind z resize-pane -Z

# --- Cerrar / Matar Panel con Foco (Directo sin prefijo) ---
# Ctrl + x -> Cierra el panel activo; si es el último, también cierra su ventana
bind -n C-x kill-pane
bind C-x kill-pane

# Ctrl + Alt + w cierra el panel; Ctrl + Alt + x cierra la ventana y todos sus paneles
bind -n C-M-w kill-pane
bind -n C-M-x kill-window
bind -n M-C-x kill-window
bind C-M-x kill-window
bind x kill-pane
bind X kill-window

# --- Manager / Gestor de Ventanas y Sesiones (Directo sin prefijo) ---
# Filas por tipo, con nombre, cantidad de paneles y carpeta de la ventana.
# choose-tree conserva la vista previa y pide confirmación al eliminar con x.
# x elimina el elemento seleccionado: ventana, panel o sesión según la fila.
# Alt+c crea una ventana en la sesión y carpeta desde las que abriste el gestor.
set -g @manager-format '#{?session_format,#[bold]SESION#[nobold] · #{session_windows} ventanas#{?session_attached, · conectada,},#{?window_format,#{=28:window_name} · #{window_panes} paneles · #{=24:#{b:pane_current_path}}#{?window_active, · ACTIVA,},#{pane_current_command} · #{=36:pane_current_path}}}'
# Ctrl + q -> Abrir Manager interactivo, ordenado por número de ventana
bind -n C-q choose-tree -Zw -O index -F '#{E:@manager-format}'
bind C-q choose-tree -Zw -O index -F '#{E:@manager-format}'
bind q choose-tree -Zw -O index -F '#{E:@manager-format}'
# Alt + w y Alt + s como alternativa para el Manager
bind -n M-w choose-tree -Zw -O index -F '#{E:@manager-format}'
bind -n M-s choose-tree -Zs -O index -F '#{E:@manager-format}'
bind w choose-tree -Zw -O index -F '#{E:@manager-format}'

# --- Navegación entre Ventanas (Directo sin prefijo) ---
# Shift + Flecha Izquierda / Derecha -> Ventana anterior y siguiente
bind -n S-Left previous-window
bind -n S-Right next-window

# Mover / Reorganizar posición de ventana (pestaña) hacia izquierda o derecha
bind -n M-S-Left swap-window -d -t -1
bind -n M-S-Right swap-window -d -t +1
bind -n C-S-Left swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1

# Ctrl + 1..5 -> Ir directo a ventana por número
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5

# Alt + 1..5 (alternativa secundaria)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Nueva ventana rápida: Ctrl + Alt + c o Alt + c
bind -n C-M-c new-window -c "#{pane_current_path}"
bind -n M-C-c new-window -c "#{pane_current_path}"
bind -n M-c new-window -c "#{pane_current_path}"
# Alt + Shift + c -> Crear una sesión y entrar en ella desde la carpeta actual
bind -n M-C new-session -c "#{pane_current_path}"
bind -n M-p previous-window
bind -n M-n next-window

# --- Navegación y Manejo Extra de Paneles/Ventanas ---
# Cambiar foco entre paneles con Ctrl + Flechas (directo sin prefijo y con prefijo)
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind C-Left select-pane -L
bind C-Right select-pane -R
bind C-Up select-pane -U
bind C-Down select-pane -D

# Cambiar foco entre paneles con Alt + Flechas y Alt + h/j/k/l (sin usar prefijo)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Redimensionar paneles directamente con Ctrl + Alt + Flechas (sin prefijo)
bind -n C-M-Left resize-pane -L 3
bind -n C-M-Right resize-pane -R 3
bind -n C-M-Up resize-pane -U 3
bind -n C-M-Down resize-pane -D 3

# Redimensionar paneles con Prefijo + Alt + Flechas
bind -r M-Left resize-pane -L 3
bind -r M-Right resize-pane -R 3
bind -r M-Up resize-pane -U 3
bind -r M-Down resize-pane -D 3

# Intercambiar posición de paneles con Alt + Shift + Arriba / Abajo
bind -n M-S-Up swap-pane -U
bind -n M-S-Down swap-pane -D

# Reorganizar el diseño / layout de paneles automáticamente con Alt + Espacio
bind -n M-Space next-layout
bind -n M-r rotate-window

# Crear nueva ventana en el directorio actual
bind c new-window -c "#{pane_current_path}"

# Recargar configuración rápidamente con Prefijo + r
bind r source-file ~/.tmux.conf \; display-message "⚡ Configuración de tmux recargada"

# ==============================================================================
# ESTILO VISUAL: TRANSPARENCIA TOTAL + CÁPSULAS AZUL NEÓN INTENSO (NERD FONT)
# ==============================================================================

# Transparencia total del fondo (respeta el acrílico/opacidad de la terminal)
setw -g window-active-style 'fg=default,bg=default'
setw -g window-style 'fg=default,bg=default'

# Bordes de paneles en azul neón sobre fondo transparente
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-style 'fg=#1e3a8a,bg=default'
set -g pane-active-border-style 'fg=#38bdf8,bg=default'

# Estilo de selección y modo copia
setw -g mode-style 'fg=#ffffff,bg=#2563eb,bold'

# Mensajes y línea de comandos de tmux
set -g message-style 'fg=#ffffff,bg=#2563eb,bold'
set -g message-command-style 'fg=#dbeafe,bg=#1e3a8a,bold'

# Barra de estado transparente con cápsulas redondeadas (estilo Powerlevel10k)
set -g status 2
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#dbeafe,bg=default'

# Izquierda: Cápsula de sesión + panel con iconos MesloLGS NF
set -g status-left-length 60
set -g status-left "#[fg=#0284c7,bg=default]#[fg=#ffffff,bg=#0284c7,bold]  #S #[fg=#ffffff,bg=#0284c7]#[fg=#e0f2fe,bg=#0284c7,bold]  #I:#P #[fg=#0284c7,bg=default] "

# Centro/Izquierda: Pestañas de ventanas como cápsulas flotantes
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#0f2952,bg=default]#[fg=#93c5fd,bg=#0f2952]  #I:#W #[fg=#0f2952,bg=default]"
setw -g window-status-current-format "#[fg=#2563eb,bg=default]#[fg=#ffffff,bg=#2563eb,bold]  #I:#W#{?window_zoomed_flag, ,} #[fg=#2563eb,bg=default]"

# Derecha: carpeta y reloj; los atajos tienen su propia fila para no tapar pestañas.
set -g status-right-length 40
set -g status-right "#[fg=#1d4ed8,bg=default]#[fg=#ffffff,bg=#1d4ed8,bold]  #{=20:#{b:pane_current_path}} #[fg=#1d4ed8,bg=default] #[fg=#0284c7,bg=default]#[fg=#ffffff,bg=#0284c7,bold]  %H:%M #[fg=#0284c7,bg=default]"

# Ayuda contextual: cambia al abrir el gestor y vuelve al salir con q o Enter.
# En terminales estrechas, las acciones principales aparecen primero.
set -g @manager-help '#[fg=#38bdf8,bold] GESTOR #[fg=#cbd5e1,nobold]│ #[fg=#86efac,bold]Alt+c#[fg=#cbd5e1,nobold] Nueva ventana · #[fg=#fda4af,bold]x#[fg=#cbd5e1,nobold] Eliminar selección · #[fg=#93c5fd,bold]Enter#[fg=#cbd5e1,nobold] Abrir · #[fg=#93c5fd,bold]q#[fg=#cbd5e1,nobold] Salir#{?#{e|>=:#{client_width},120}, · ↑↓ Mover · +/- Expandir · v Vista previa,}'
set -g @workspace-help '#[fg=#86efac,bold] Alt+c#[fg=#cbd5e1,nobold] Nueva ventana · #[fg=#fda4af,bold]Ctrl+Alt+x#[fg=#cbd5e1,nobold] Cerrar ventana · #[fg=#86efac,bold]Alt+Shift+c#[fg=#cbd5e1,nobold] Nueva sesión · #[fg=#38bdf8,bold]Ctrl+q#[fg=#cbd5e1,nobold] Gestor#{?#{e|>=:#{client_width},140}, · Ctrl+x Cerrar panel · ^T Horizontal · ^F Vertical · ^Z Zoom,}'
set -g status-format[1] '#[fill=#0b1220,bg=#0b1220,fg=#cbd5e1]#{?#{==:#{pane_mode},tree-mode},#{E:@manager-help},#{E:@workspace-help}}'

# Usar siempre zsh dentro de tmux
set -g default-shell /usr/bin/zsh

# Ctrl+G dentro de keifu (kg): abre el gestor de ramas gbm en un popup
# (switch, pull origin, terminar rama, borrar local/remota). En otros programas Ctrl+G funciona normal.
bind -n C-g if-shell -F "#{==:#{pane_current_command},keifu}" \
  { display-popup -E -w 80% -h 70% -d "#{pane_current_path}" -e NO_TMUX=1 -e GBM_POPUP=1 "zsh -ic gbm" } \
  { send-keys C-g }

# Barra de scroll visual (solo aparece al entrar en modo copia/scroll) y sin el indicador [0/532]
set -g pane-scrollbars modal
set -g pane-scrollbars-style 'fg=colour244,bg=default,width=1,pad=0'
set -g copy-mode-position-format ''
