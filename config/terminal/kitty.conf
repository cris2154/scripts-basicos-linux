# ==============================================================================
# Kitty Configuration - Tema Azul Neón (scripts-basicos-linux)
# ==============================================================================

# Fuente (MesloLGS NF para iconos y Powerlevel10k)
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Espaciado y bordes
window_padding_width 15
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

# Transparencia
background_opacity 0.85

# Cursor
cursor #A78BFA
cursor_text_color #120C24
cursor_shape block
cursor_blink_interval 0.5

# Selección
selection_foreground #FFFFFF
selection_background #6D28D9

# Paleta de Colores (Azul Neón / Scheme 17)
background #120C24
foreground #FFFFFF

# Negro
color0 #0C0C0C
color8 #767676

# Rojo
color1 #C50F1F
color9 #E74856

# Verde
color2 #13A10E
color10 #16C60C

# Amarillo
color3 #C19C00
color11 #F9F1A5

# Azul
color4 #2563EB
color12 #38BDF8

# Magenta
color5 #881798
color13 #B4009E

# Cian
color6 #0EA5E9
color14 #67E8F9

# Blanco
color7 #CCCCCC
color15 #F2F2F2

# Barra de pestañas
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #FFFFFF
active_tab_background   #7C3AED
active_tab_font_style   bold
inactive_tab_foreground #C4B5FD
inactive_tab_background #241A45
inactive_tab_font_style normal

# Sonido de campana desactivado
enable_audio_bell no

# Shell predeterminada
shell /usr/bin/zsh

# Estela animada del cursor
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 2
