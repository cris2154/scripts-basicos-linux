# Dedicated appearance for Ranger embedded in Gentleman Neovim.
set colorscheme gentleman
set column_ratios 1,3,4
set draw_borders both
set unicode_ellipsis true
set show_cursor false
set display_size_in_main_column true
set display_size_in_status_bar true
set display_tags_in_all_columns false
set dirname_in_tabs false
set preview_images false
set vcs_aware false

# Keep the header focused on the current home-relative directory.
set hostname_in_titlebar false
set tilde_in_titlebar true
set show_selection_in_titlebar false
